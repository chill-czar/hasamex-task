name: Deploy to Google Cloud (Zero Docker)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Single-Instance Compute Engine VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Next.js Static Export
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Supports Service Account Key secret or Workload Identity Provider
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Bootstrap GCS Remote State Bucket
        run: |
          chmod +x infra/bootstrap/bootstrap_state.sh
          ./infra/bootstrap/bootstrap_state.sh us-central1

      - name: Terraform Init & Apply
        working-directory: infra/terraform
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token)
          terraform init -reconfigure
          terraform apply -auto-approve -var="gemini_api_key=${GEMINI_API_KEY}"

      - name: Sync Code and Reload Service on VM
        run: |
          chmod +x infra/scripts/sync_code.sh
          ./infra/scripts/sync_code.sh us-central1-a

      - name: Verify Live Deployment Health Check
        working-directory: infra/terraform
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          echo "Verifying deployment at http://${VM_IP}/api/health..."
          for i in {1..12}; do
            if curl -s -f "http://${VM_IP}/api/health" | grep -q "healthy"; then
              echo "Deployment healthy and responding successfully!"
              exit 0
            fi
            echo "Waiting for service to become healthy (attempt $i/12)..."
            sleep 10
          done
          echo "Health check timed out."
          exit 1
